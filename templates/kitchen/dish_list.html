{% extends "base.html" %}

{% block content %}
  <h1>Dishes List</h1>

  {% if dishes %}
    <ul class="list-group">
      {% for dish in dishes %}
        <li class="list-group-item">
          <a href="{% url 'kitchen:dish-detail' dish.id %}">
            <strong>{{ dish.name }}</strong>
          </a>
          <br>
          {{ dish.description }}
        </li>
      {% endfor %}
    </ul>
  {% else %}
    <p>No dishes found.</p>
  {% endif %}
{% endblock %}

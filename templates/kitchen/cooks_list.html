{% extends "base.html" %}

{% block content %}
  <h1>
    Cooks List
    <a style="float: right" href="{% url 'kitchen:cooks-create' %}" class="btn btn-success">+ Add Cook</a>
  </h1>
  {% if cooks %}
    <ul class="list-group">
      {% for cook in cooks %}
        <li class="list-group-item d-flex justify-content-between align-items-center">
          <div>
            <a href="{% url 'kitchen:cooks-detail' cook.id %}">
              {{ cook.first_name }} {{ cook.last_name }}
            </a>
          </div>
          <div>
            <a href="{% url 'kitchen:cook-update' cook.id %}" class="btn btn-sm btn-primary">Update</a>
            <a href="{% url 'kitchen:cook-delete' cook.id %}" class="btn btn-sm btn-danger">Delete</a>
          </div>
        </li>
      {% endfor %}
    </ul>
  {% else %}
    <p>No cooks found.</p>
  {% endif %}
{% endblock %}

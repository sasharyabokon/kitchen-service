{% extends 'base.html' %}

{% block content %}
  <h1>Dish Types List</h1>
    {% if dish_type_list %}
      <ul>
        {% for dish_type in dish_type_list %}
          <li>
          <a href="{% url 'kitchen:dish_type_detail' dish_type.id %}">
            {{ dish_type.name }}
          </a>
          </li>
        {% endfor %}
      </ul>
    {% else %}
    <p>No dish types found.</p>
  {% endif %}
{% endblock %}

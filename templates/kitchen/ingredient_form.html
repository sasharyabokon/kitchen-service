{% extends "base.html" %}
{% load crispy_forms_tags %}

{% block content %}
<div class="container-fluid py-4" style="font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif !important;">
  <div class="row justify-content-center">
    <div class="col-12 col-md-8 col-lg-6">
      <div class="card border-0 shadow-sm border-radius-xl mb-4" style="background-color: #FFFFFF !important; border-radius: 1rem;">
        <div class="card-header pb-0 p-4 bg-transparent border-0">
          <h1 class="h3 font-weight-bold text-dark mb-0" style="font-size: 26px; font-weight: 700; color: #1F2937 !important;">
            {% if object %}Update Ingredient{% else %}Create Ingredient{% endif %}
          </h1>
        </div>
        <div class="card-body p-4 pt-3">
          <form action="" method="post" novalidate>
            {% csrf_token %}

            <div class="mb-3 soft-crispy-form">
              {{ form|crispy }}
            </div>

            <div class="d-flex justify-content-end align-items-center gap-2 mt-4 pt-2 border-top" style="border-color: #E5E7EB !important;">
              <a href="javascript:history.back()" class="btn btn-light px-4 py-2 mb-0 shadow-sm" style="border-radius: 8px; font-weight: 600; font-size: 14px; background-color: #F3F4F6 !important; color: #374151 !important; border: none !important;">Cancel</a>
              <button type="submit" class="btn text-white px-4 py-2 mb-0 shadow-sm" style="background-color: #10B981 !important; border: none !important; border-radius: 8px; font-weight: 600; font-size: 14px;">
                Save
              </button>
            </div>
          </form>
        </div>
      </div>
    </div>
  </div>
</div>

<style>
  .soft-crispy-form .input-group,
  .soft-crispy-form input,
  .soft-crispy-form select,
  .soft-crispy-form textarea {
    border-radius: 0.5rem !important;
    border-color: #E5E7EB !important;
    padding: 0.65rem 0.75rem !important;
    font-size: 14px !important;
    color: #1F2937 !important;
  }
  .soft-crispy-form input:focus,
  .soft-crispy-form select:focus,
  .soft-crispy-form textarea:focus {
    border-color: #10B981 !important;
    box-shadow: 0 0 0 2px rgba(16, 185, 129, 0.15) !important;
  }
  .soft-crispy-form label {
    font-weight: 600 !important;
    font-size: 13px !important;
    color: #374151 !important;
    margin-bottom: 0.4rem !important;
  }
  .soft-crispy-form .asteriskField {
    color: #EF4444 !important;
  }
</style>
{% endblock %}

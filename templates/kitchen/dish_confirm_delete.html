{% extends "base.html" %}

{% block content %}
<div class="container-fluid py-4" style="font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif !important;">
  <div class="row justify-content-center">
    <div class="col-12 col-md-8 col-lg-6">
      <div class="card border-0 shadow-sm border-radius-xl mb-4" style="background-color: #FFFFFF !important; border-radius: 1rem;">
        <div class="card-header pb-0 p-4 bg-transparent border-0 text-center">
          <div class="mx-auto mb-3 d-flex align-items-center justify-content-center shadow-sm" style="width: 56px; height: 56px; background-color: #FEE2E2 !important; border-radius: 1rem; color: #EF4444;">
            <i class="bi bi-exclamation-triangle-fill" style="font-size: 26px;"></i>
          </div>
          <h1 class="h3 font-weight-bold text-dark mb-1" style="font-size: 24px; font-weight: 700; color: #1F2937 !important;">Delete Dish</h1>
          <p class="text-secondary text-sm mb-0" style="font-size: 14px;">Are you sure you want to delete this dish? All related information will be permanently removed.</p>
        </div>

        <div class="card-body p-4 pt-3">
          <div class="p-3 mb-4 rounded-3" style="background-color: #F8F9FA !important; border: 1px solid #E5E7EB;">
            <span class="text-dark font-weight-bold" style="font-size: 16px;">{{ object.name }}</span>
            {% if object.dish_type %}
              <div class="text-muted small mt-1">Type: {{ object.dish_type.name }}</div>
            {% endif %}
          </div>

          <form action="" method="post">
            {% csrf_token %}
            <div class="d-flex justify-content-end align-items-center gap-2 pt-2 border-top" style="border-color: #E5E7EB !important;">
              <a href="{% url 'kitchen:dish-list' %}" class="btn btn-light px-4 py-2 mb-0 shadow-sm" style="border-radius: 8px; font-weight: 600; font-size: 14px; background-color: #F3F4F6 !important; color: #374151 !important; border: none !important;">Cancel</a>
              <button type="submit" class="btn text-white px-4 py-2 mb-0 shadow-sm custom-delete-btn" style="background-color: #EF4444 !important; border: none !important; border-radius: 8px; font-weight: 600; font-size: 14px;">
                Yes, delete
              </button>
            </div>
          </form>
        </div>
      </div>
    </div>
  </div>
</div>

<style>
  .custom-delete-btn:hover {
    background-color: #DC2626 !important;
    color: #ffffff !important;
  }
</style>
{% endblock %}

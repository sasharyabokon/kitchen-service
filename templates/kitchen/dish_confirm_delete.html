{% extends "base.html" %}
{% block content %}
  <h1>Delete Dish</h1>
  <p>Are you sure you want to delete the dish: "{{ object.name }}"?</p>
  <p><i>All information about this dish will also be deleted!</i></p>
  <form action="" method="post">
    {% csrf_token %}
    <input type="submit" value="Yes, delete" class="btn btn-danger">
   <a href="{% url 'kitchen:dish-list' %}" class="btn btn-secondary">Cancel</a>
  </form>
{% endblock %}

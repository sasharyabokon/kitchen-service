{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
  <title>{% block title %}Kitchen Service{% endblock %}</title>

  <link href="https://fonts.googleapis.com/css?family=Open+Sans:300,400,600,700" rel="stylesheet" />
  <link href="{% static 'assets/css/nucleo-icons.css' %}" rel="stylesheet" />
  <link href="{% static 'assets/css/nucleo-svg.css' %}" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <script src="https://kit.fontawesome.com/42d5adcbca.js" crossorigin="anonymous"></script>

  <link id="pagestyle" href="{% static 'assets/css/soft-ui-dashboard.css' %}" rel="stylesheet" />

  <style>
    :root {
      --bg-main: #F9FAFB;
      --card-bg: #FFFFFF;
      --text-main: #1F2937;
      --text-muted: #4B5563;
      --border-color: #E5E7EB;
      --primary-green: #10B981;
      --danger-red: #EF4444;
    }

    body {
      background-color: var(--bg-main) !important;
      color: var(--text-main) !important;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif !important;
    }

    .container-fluid .card:not(.page-header .card):not([data-background-color] .card):not(.position-relative .card) {
      background-color: var(--card-bg) !important;
      border-color: var(--border-color) !important;
      border-radius: 1rem !important;
    }

    .breadcrumb {
      background-color: transparent !important;
      padding: 0 !important;
    }
    .breadcrumb-item a {
      color: var(--text-muted) !important;
      text-decoration: none !important;
    }
    .breadcrumb-item.active {
      color: var(--text-main) !important;
      font-weight: 500;
    }

    .bg-gradient-warning, .btn-warning, .bg-warning,
    [class*="bg-gradient-warning"], [class*="btn-warning"], [class*="bg-warning"],
    .btn.bg-gradient-warning, .btn.btn-warning,
    form button[type="submit"], form .btn {
      background: #10B981 !important;
      background-image: none !important;
      border-color: #10B981 !important;
      color: #ffffff !important;
    }
    .btn-warning:hover, .btn-outline-warning:hover,
    [class*="btn-warning"]:hover, [class*="btn-outline-warning"]:hover,
    form button[type="submit"]:hover, form .btn:hover {
      background: #059669 !important;
      border-color: #059669 !important;
      color: #ffffff !important;
    }
    .text-warning, [class*="text-warning"] {
      color: #10B981 !important;
    }
    .btn-outline-warning, [class*="btn-outline-warning"] {
      color: #10B981 !important;
      border-color: #10B981 !important;
      background-color: transparent !important;
    }
    .badge.bg-gradient-warning, .badge.bg-warning {
      background-color: #F3F4F6 !important;
      color: #374151 !important;
      border: 1px solid #E5E7EB !important;
    }
    .sidenav .nav-item .nav-link.active .nav-link-text {
      color: #ffffff !important;
    }
    .sidenav .nav-item .nav-link.active .icon i {
      color: #344767 !important;
    }

    form.input-group, .input-group {
      display: flex;
      align-items: center;
    }
    form.input-group .btn, .input-group .btn {
      margin-bottom: 0 !important;
      height: 100%;
    }
    .card.bg-dark, .card[data-background-color="dark"] {
      background-color: #0F172A !important;
      color: #ffffff !important;
    }
    .card.bg-dark *, .card[data-background-color="dark"] * {
      color: #ffffff !important;
    }
    .card.bg-dark .btn, .card[data-background-color="dark"] .btn {
      border-color: #475569 !important;
      color: #ffffff !important;
      background-color: #334155 !important;
    }
    a:hover {
      color: #10B981 !important;
    }
  </style>
</head>

<body class="g-sidenav-show">

  {% include "includes/sidebar.html" %}

  <main class="main-content position-relative max-height-vh-100 h-100 border-radius-lg">

    <div class="container-fluid py-4">
      {% if messages %}
        <div class="mb-4">
          {% for message in messages %}
            <div class="alert
              {% if message.tags == 'success' %}alert-success text-white{% elif message.tags == 'error' or message.tags == 'danger' %}alert-danger text-white{% elif message.tags == 'warning' %}alert-warning text-dark{% else %}alert-info text-white{% endif %}
              border-0 shadow-sm fade show mb-2"
              role="alert"
              style="border-radius: 0.75rem; background-color: {% if message.tags == 'success' %}#10B981{% elif message.tags == 'error' or message.tags == 'danger' %}#EF4444{% elif message.tags == 'warning' %}#F59E0B{% else %}#3B82F6{% endif %} !important; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif !important;">
              <div class="d-flex justify-content-between align-items-center">
                <span class="text-white font-weight-bold" style="font-size: 14px;">{{ message }}</span>
                <button type="button" class="btn-close btn-close-white" data-bs-dismiss="alert" aria-label="Close"></button>
              </div>
            </div>
          {% endfor %}
        </div>
      {% endif %}

      {% block content %}
      {% endblock %}

      {% include "includes/pagination.html" %}
    </div>

  </main>

  <script src="{% static 'assets/js/core/popper.min.js' %}"></script>
  <script src="{% static 'assets/js/core/bootstrap.min.js' %}"></script>
  <script src="{% static 'assets/js/plugins/perfect-scrollbar.min.js' %}"></script>
  <script src="{% static 'assets/js/plugins/smooth-scrollbar.min.js' %}"></script>
  <script src="{% static 'assets/js/soft-ui-dashboard.min.js' %}"></script>

  <script>
    document.addEventListener("DOMContentLoaded", function() {
      var alerts = document.querySelectorAll('.alert');
      alerts.forEach(function(alert) {
        setTimeout(function() {
          var bsAlert = new bootstrap.Alert(alert);
          bsAlert.close();
        }, 4000);
      });
    });
  </script>
</body>
</html>
